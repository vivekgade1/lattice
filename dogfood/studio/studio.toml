# Lattice Studio project: Lattice Studio's own server, specified in Lattice (dogfooding).
# The app is the real server (python -m lattice.studio, TEST-ONLY stub LLM) on a fresh git
# copy of project_seed/, per scenario; see harness.py. ./check.sh runs the same check.
[project]
name = "lattice-studio"   # the name Studio serves it under (/p/lattice-studio/api/...)

[app]
app = "harness:make_app"
db = "harness:build_db"
runtime = "harness:RUNTIME"
database = "sqlite"

[check]
layers = "DX"   # A, B, C and R have nothing to bind to (no Python web framework, no database)

[llm]
model = "sonnet"

# The rebuild loop (lattice/studio/rebuild.py, API.md v1.7): the repository is the lattice
# checkout, the gates run from its root in the rebuild's worktree.
[rebuild]
repo = "../.."
gates = ["dogfood/studio/check.sh", "uv run pytest tests/studio -q"]
