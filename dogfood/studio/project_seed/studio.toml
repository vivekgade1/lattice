# The project the dogfood check serves (dogfood/studio). TEST ONLY: the stub LLM drafts
# every change deterministically (lattice.studio.server.StubGenerator); no app is hooked up.
[llm]
backend = "stub"
model = "stub"

# TEST ONLY: the rebuild loop's stub agent writes round k's files of stub-rebuild.json
# (round 1 also tries to edit REQUIREMENTS.md, which Studio must restore); gate.sh passes
# iff writing.txt and reading.txt exist, so a rebuild of a change passes in round 2.
# A scoped build (API v1.8) of the area writing-notes or reading-notes plays that scope's
# rounds instead. Only "release" is protected, so the checked-out "main" is refused as a
# target for being checked out (not for being protected).
[rebuild]
agent = "stub"
gates = ["./gate.sh"]
max_rounds = 3
protected_branches = ["release"]
# TEST ONLY (API.md v1.9): build plans come from stub-plan.json, one planner document per
# plan scope (see lattice/studio/plan.py); their nodes play stub-rebuild.json's rounds by
# node id.
planner = "stub"
# API.md v1.11: plan nodes run the gate scoped (gate.sh takes the flags of `lattice spec
# check`), and a level ends with the regression gate (the last level with the full gate).
scoped_gate_args = ["--layers", "CD", "--x-repeats", "1", "--await-cap", "5"]
level_gate = "regression"
# API.md v1.12: a plan run first syncs the committed spec of HEAD onto its target branch when
# they differ (one commit, before the start baseline).
sync_spec = "auto"
