[project]
name = "lattice"
version = "0.1.0"
description = "Statically checked Python-AST profile for LLM-generated data pipelines"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "pyarrow>=17",
    "pandas>=2.2",
    "anthropic>=0.60",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
