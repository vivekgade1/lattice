[project]
name = "lattice"
version = "0.1.0"
description = "Statically checked Python-AST profile for LLM-generated data pipelines"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "pyarrow>=17",
    "pandas>=2.2",
    "anthropic>=0.60",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]
template = [
    "email-validator>=2.1.0.post1",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.27",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
default-groups = ["dev", "template"]
