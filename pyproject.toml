[project]
name = "lattice"
version = "0.1.0"
description = "Statically checked Python-AST profile for LLM-generated data pipelines"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "pyarrow>=17",
    "pandas>=2.2",
    "anthropic>=0.60",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
lattice = "lattice.cli:main"

[project.optional-dependencies]
db = [
    "clickhouse-connect>=0.8",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "uvicorn>=0.30"]
template = [
    "email-validator>=2.1.0.post1",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.27",
    "sqlmodel>=0.0.39",
]
# tests/spec/test_authoring.py's proof run: the real job-scheduler app
# (/Users/vivekgade/Documents/job-scheduler), imported read-only via sys.path. Its own
# dependencies are covered by `template` above except croniter (cron expression
# parsing), which is unique to it.
job_scheduler_proof = [
    "croniter>=6.2.4",
]
# Held-out repos for the importer (I6a): bench/import_repos/. Everything else these
# apps need (sqlmodel, pydantic-settings, pyjwt, pwdlib, email-validator) is already
# covered by the `template` group above; python-jose is the one dependency unique to
# JustNotes (bench/import_repos/justnotes) -- its JWT helper is unmodified upstream
# code, so it was stubbed only where that was possible (see PROVENANCE.md) and added
# here where it was not.
import_repos = [
    "python-jose>=3.5.0",
]
# Phase 2 dev apps (bench/import_repos/{snippets,recipes,microblog,flasky}, plan
# docs/superpowers/plans/2026-10-05-phase2-python-import.md W1-C) plus the libraries the
# plan lists for the held-out apps (simplejwt, django-filter, flask-jwt-extended).
# pygments: snippets; pillow: recipes' ImageField; flask-login, markdown, bleach: flasky;
# alchemical, flask-marshmallow, marshmallow-sqlalchemy, flask-cors, flask-mail,
# requests: microblog. marshmallow < 4 (and so flask-marshmallow < 1.5): marshmallow 4
# passes data_key to @validates methods, which microblog's do not accept.
phase2_apps = [
    "alchemical>=1.0.3",
    "apifairy>=1.5.1",
    "bleach>=6.4.0",
    "django>=6.1.1",
    "django-filter>=26.2",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "flask>=3.1.3",
    "flask-apispec>=0.11.4",
    "flask-bcrypt>=1.0.1",
    "flask-caching>=2.5.1",
    "flask-cors>=6.0.5",
    "flask-httpauth>=4.8.1",
    "flask-jwt-extended>=4.7.4",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-marshmallow>=1.3,<1.5",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "loguru>=0.7.3",
    "markdown>=3.11",
    "marshmallow>=3.26,<4",
    "marshmallow-sqlalchemy>=1.5.0",
    "pillow>=12.3.0",
    "pygments>=2.21.0",
    "requests>=2.34.2",
    "unicode-slugify>=0.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Claude API (deselected by default)",
    "slow: minutes of checking (Phase 1 dry run coverage)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
# the importer's committed output (python -m lattice.importer), never edited by hand
# and verbatim model-written round-3/4 artefacts kept as normalisation / diagnostic fixtures
# (tests/t2ir/golden holds Lattice sources, one per lowering golden test)
extend-exclude = [
    "bench/imports",
    "tests/fixtures/normalise",
    "tests/fixtures/diag_hints",
    "tests/t2ir/golden",
    "tests/importer/goldens",
    "bench/heldout",
    "bench/import_repos/drf_blog",
    "bench/import_repos/projmgmt",
    "bench/import_repos/conduit",
    "bench/import_repos/realworld",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
default-groups = ["dev", "template", "import_repos", "phase2_apps", "job_scheduler_proof"]
