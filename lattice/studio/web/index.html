<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lattice Studio</title>
  <meta name="description" content="See a business spec as linked views, ask questions about it, and review checked changes.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 15 8 8 15 1 8Z' fill='%233b5bdb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the view</a>
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◇</span>
      <span class="brand-name">Lattice Studio</span>
    </div>
    <div class="project" id="project" aria-live="polite">
      <span class="project-name">Loading…</span>
    </div>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <div class="shell">
    <nav class="leftnav" id="leftnav" aria-label="Spec views"></nav>
    <main class="main" id="main" tabindex="-1" aria-live="off"></main>
    <aside class="chat" id="chat" aria-labelledby="chat-title"></aside>
  </div>
  <noscript><p class="noscript">Lattice Studio needs JavaScript.</p></noscript>
</body>
</html>
