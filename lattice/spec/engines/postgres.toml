# The PostgreSQL engine of the spec checker: a descriptor (lattice/spec/engines.py; every
# field: docs/design/lattice-module-descriptor.md). Data only: the adapter is the built-in
# psycopg 3 one (lattice.spec.db.PostgresDatabase).
name = "postgres"
title = "PostgreSQL"
aliases = ["postgresql"]
url_schemes = ["postgres", "postgresql"]
url_template = "postgresql://{user}:{password}@{host}:{port}/{db}?sslmode=disable"
default_port = 5432
adapter = "postgres"
requires = ["psycopg[binary]>=3.2"]
clone = "template"

[drivers]
go-pgx = "{url}"
go-pq = "{url}"
psycopg = "{url}"
libpq = "{url}"
sqlalchemy = "postgresql+psycopg://{rest}"
jdbc = { template = "jdbc:postgresql://{hostport}/{db}", query_auth = true, query_url = true }

[sql]
identifier_quote = '"'
placeholder = "%s"
true_literal = "TRUE"
false_literal = "FALSE"
backslash_escapes = false
float_cast = "{x}"
divide = "(({a}) * 1.0 / ({b}))"
list_tables = "SELECT table_name FROM information_schema.tables WHERE table_schema = current_schema() AND table_type = 'BASE TABLE' ORDER BY table_name"
list_columns = "SELECT column_name FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = %s ORDER BY ordinal_position"
drop_database = "DROP DATABASE IF EXISTS {name} WITH (FORCE)"
# other connections to a database are ended before it is cloned (a template must be idle)
terminate_sessions = "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = %s AND pid <> pg_backend_pid()"
clone_template = "CREATE DATABASE {name} TEMPLATE {template}"

[capabilities]
unique_constraints = true
transactions = true

[server]
image = "postgres:16-alpine"
port = 5432
data_dir = "/var/lib/postgresql/data"
admin_user = "{user}"
admin_db = "postgres"
env = { POSTGRES_USER = "{user}", POSTGRES_PASSWORD = "{password}", POSTGRES_DB = "postgres" }
# a throwaway database: durability off, connections for layer X's clients
args = ["-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
ready_sql = "SELECT 1"

# lattice perf: statements are counted from pg_stat_statements, per measured database. The
# extension is preloaded by the started container's arguments and created by setup; check
# proves it answers; a window is a reset of the measured database's statistics and a read
# (a backend updates the statistics before it answers, so no flush is needed).
[perf]
counter = "sql"
source = "pg_stat_statements (top-level statement executions in the measured database)"
server_args = ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top", "-c", "pg_stat_statements.track_utility=on"]
setup = ["CREATE EXTENSION IF NOT EXISTS pg_stat_statements"]
check = ["SELECT count(*) FROM pg_stat_statements"]
begin = ["SELECT pg_stat_statements_reset(0::oid, (SELECT oid FROM pg_database WHERE datname = {db}), 0::bigint)"]
read = "SELECT query, calls FROM pg_stat_statements WHERE dbid = (SELECT oid FROM pg_database WHERE datname = {db}) AND toplevel ORDER BY query, queryid"
