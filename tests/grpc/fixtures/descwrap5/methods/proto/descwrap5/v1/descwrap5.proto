syntax = "proto3";

package descwrap5.v1;

option go_package = "example.com/d5methods/gen/descwrap5/v1;descwrap5v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Rng {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Apd {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Lit {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Opaque {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
