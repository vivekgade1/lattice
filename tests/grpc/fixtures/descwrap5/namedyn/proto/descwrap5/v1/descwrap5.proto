syntax = "proto3";

package descwrap5.v1;

option go_package = "example.com/d5namedyn/gen/descwrap5/v1;descwrap5v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Plain {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Dyn {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Spare {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
