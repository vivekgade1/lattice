syntax = "proto3";

package codes6.v1;

option go_package = "example.com/c6pass/gen/codes6/v1;codes6v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Pass {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
  rpc Del(Req) returns (Rep);
  rpc Find(Req) returns (Rep);
  rpc Conv(Req) returns (Rep);
  rpc Raw(Req) returns (Rep);
}
