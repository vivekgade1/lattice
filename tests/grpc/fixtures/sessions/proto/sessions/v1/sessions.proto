syntax = "proto3";

package sessions.v1;

option go_package = "example.com/sessionsapp/gen/sessions/v1;sessionsv1";

// Sessions: a login that mints a session, two rpcs that change what the session can do
// afterwards (SignOut revokes it, DeleteMe deletes the account), one protected read, one
// rpc the server never implements, and a public liveness probe.
service Sessions {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc DeleteMe(DeleteMeRequest) returns (DeleteMeResponse);
  rpc Secret(SecretRequest) returns (SecretResponse);
  rpc Stub(StubRequest) returns (StubResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message LoginRequest {
  string name = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message DeleteMeRequest {}

message DeleteMeResponse {}

message SecretRequest {}

message SecretResponse {
  string message = 1;
}

message StubRequest {}

message StubResponse {}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
}
