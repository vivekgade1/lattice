syntax = "proto3";

package codes4.v1;

option go_package = "example.com/c4tbl/gen/codes4/v1;codes4v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Ta {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Tb {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
