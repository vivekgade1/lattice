syntax = "proto3";

package wiring4.v1;

option go_package = "example.com/w4unres/gen/wiring4/v1;wiring4v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Plain {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Mystery {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Orphan {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
