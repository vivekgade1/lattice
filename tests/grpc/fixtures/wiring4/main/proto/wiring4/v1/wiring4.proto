syntax = "proto3";

package wiring4.v1;

option go_package = "example.com/w4main/gen/wiring4/v1;wiring4v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Gen {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Twin {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Reg {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service RegB {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Ghost {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Absent {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
