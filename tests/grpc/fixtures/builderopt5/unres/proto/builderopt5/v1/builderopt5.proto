syntax = "proto3";

package builderopt5.v1;

option go_package = "example.com/b5unres/gen/builderopt5/v1;builderopt5v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Fine {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Dyn {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Orphaned {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
