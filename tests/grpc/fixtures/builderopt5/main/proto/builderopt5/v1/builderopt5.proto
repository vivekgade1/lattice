syntax = "proto3";

package builderopt5.v1;

option go_package = "example.com/b5main/gen/builderopt5/v1;builderopt5v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service One {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Two {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Parked {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Absent {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
