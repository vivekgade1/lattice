syntax = "proto3";

package wiring.v1;

option go_package = "example.com/wiringapp/gen/wiring/v1;wiringv1";

// One service per way the server can be wired (read by the extractor; not run).
message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Alpha {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Beta {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Gamma {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Delta {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Epsilon {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Zeta {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Eta {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Dead {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Gone {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Never {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}

service Opaque {
  rpc Get(Req) returns (Rep);
  rpc Put(Req) returns (Rep);
}
