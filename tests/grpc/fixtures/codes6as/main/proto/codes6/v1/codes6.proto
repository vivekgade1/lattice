syntax = "proto3";

package codes6.v1;

option go_package = "example.com/c6as/gen/codes6/v1;codes6v1";

message Req {
  string name = 1;
}

message Rep {
  string name = 1;
}

service Bill {
  rpc Get(Req) returns (Rep);
  rpc Pay(Req) returns (Rep);
}

service Other {
  rpc Get(Req) returns (Rep);
}
